name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate-release:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - name: Validate stable semantic version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must be a stable semantic version such as v1.2.3" >&2
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Require release commit on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release tags must point to a commit reachable from main" >&2
            exit 1
          }

  test:
    name: Test
    needs: validate-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="cf-redirect_${version}_${GOOS}_${GOARCH}"
          mkdir -p "dist/${archive}"
          go build -trimpath -ldflags="-s -w" -o "dist/${archive}/cf-redirect" ./cmd/cf-redirect
          tar -C dist -czf "dist/${archive}.tar.gz" "${archive}"
          rm -rf "dist/${archive}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cf-redirect-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: cf-redirect-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum ./*.tar.gz > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"

  update-homebrew:
    name: Update Homebrew cask
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Create Homebrew tap token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.HOMEBREW_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-tap
          permission-contents: write
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: cf-redirect-*
          path: dist
          merge-multiple: true
      - name: Check out Homebrew tap
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.repository_owner }}/homebrew-tap
          token: ${{ steps.app-token.outputs.token }}
          path: homebrew-tap
      - name: Update cask
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          arm_sha="$(sha256sum "dist/cf-redirect_${version}_darwin_arm64.tar.gz" | cut -d ' ' -f1)"
          intel_sha="$(sha256sum "dist/cf-redirect_${version}_darwin_amd64.tar.gz" | cut -d ' ' -f1)"
          python3 - "$version" "$arm_sha" "$intel_sha" <<'PY'
          from pathlib import Path
          import re
          import sys

          version, arm_sha, intel_sha = sys.argv[1:]
          path = Path("homebrew-tap/Casks/cf-redirect.rb")
          cask = path.read_text()
          cask, version_changes = re.subn(
              r'^  version "[^"]+"$', f'  version "{version}"', cask, count=1, flags=re.MULTILINE
          )
          cask, checksum_changes = re.subn(
              r'^  sha256 arm:   "[0-9a-f]{64}",\n         intel: "[0-9a-f]{64}"$',
              f'  sha256 arm:   "{arm_sha}",\n         intel: "{intel_sha}"',
              cask,
              count=1,
              flags=re.MULTILINE,
          )
          if version_changes != 1 or checksum_changes != 1:
              raise SystemExit("could not find the expected version and checksum stanzas")
          path.write_text(cask)
          PY
          ruby -c homebrew-tap/Casks/cf-redirect.rb
      - name: Commit and push cask
        working-directory: homebrew-tap
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          git add Casks/cf-redirect.rb
          git diff --cached --check
          git commit -m "Update cf-redirect to ${version}"
          git push origin HEAD:main
